name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Audit installed dependencies for known CVEs
        run: |
          python -m pip install --upgrade setuptools
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

      - name: Run pytest with coverage
        run: pytest -v --cov=secure_log2test --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Smoke-test installed CLI on sample data
        run: |
          secure-log2test data/sample_kibana_export.json --output smoke_generated.py
          python -c "import ast; ast.parse(open('smoke_generated.py').read())"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
          ls dist/

      - name: Wheel install smoke (fresh venv, no source files) [Linux/macOS]
        if: runner.os != 'Windows'
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install dist/*.whl
          /tmp/wheel-smoke-venv/bin/secure-log2test --help
          /tmp/wheel-smoke-venv/bin/secure-log2test data/sample_kibana_export.json --output wheel_smoke_out.py
          python -c "import ast; ast.parse(open('wheel_smoke_out.py').read())"

      - name: Wheel install smoke (fresh venv, no source files) [Windows]
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/Scripts/pip install dist/*.whl
          /tmp/wheel-smoke-venv/Scripts/secure-log2test --help
          /tmp/wheel-smoke-venv/Scripts/secure-log2test data/sample_kibana_export.json --output wheel_smoke_out.py
          python -c "import ast; ast.parse(open('wheel_smoke_out.py').read())"
